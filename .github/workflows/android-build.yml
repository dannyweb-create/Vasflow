name: Android build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter (pinned version)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.0"
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Prepare Android project files
        run: bash tool/prepare_android.sh

      - name: Get dependencies
        run: flutter pub get

      # The next three steps only REPORT problems for now (continue-on-error).
      # Once they pass cleanly in the logs, delete the "continue-on-error" line
      # from each step so they will block the build when something is wrong.
      - name: Check formatting (report only)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code (report only)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Run tests (report only)
        continue-on-error: true
        run: flutter test

      - name: Warn if Supabase secrets are missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing. The APK will build, but it will only show the 'Setup required' screen."
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vasflow-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
